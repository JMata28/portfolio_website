<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <!--From bootstrap documentation-->
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title> José Mata's Software Engineer Portfolio </title>
        <!--From bootstrap documentation-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
        <!-- Links to use Space Grotesk Font from Google Fonts (license permits this use)-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Modal for page in construction -->
        <div class="modal fade" id="constructionModal" tabindex="-1" aria-labelledby="constructionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content bg-black text-white text-center border border-white">
            <div class="modal-body d-flex justify-content-center align-items-center">
                <h1>This page is currently under construction. Check back soon for updates!</h1>
            </div>
            <div class="modal-footer justify-content-center border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>
        <!--Modals that display Demo Videos-->
        <!--PGS Web App DEMO Video-->
        <div class="modal fade" id="PGSWebAppDEMOModal" tabindex="-1" aria-labelledby="PGSWebAppDEMOModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="PGSWebAppDEMOModalLabel">Plant Growth Station - Web App DEMO Video</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex justify-content-center">
                <!-- Video inside modal -->
                <video controls autoplay style="max-width: 100%; height: auto;">
                <source src="{{ PGS_Web_App_DEMO_Video_URL }}" type="video/mp4">
                Your browser does not support HTML5 video.
                </video>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>
        <!--PGS Hardware Device DEMO Video-->
        <div class="modal fade" id="PGSHardwareDEMOModal" tabindex="-1" aria-labelledby="PGSHardwareDEMOModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="PGSHardwareDEMOModalLabel">Plant Growth Station - Hardware Device Demo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex justify-content-center">
                <!-- Video inside modal -->
                <video controls autoplay style="max-width: 100%; height: auto;">
                <source src="{{ PGS_Hardware_DEMO_Video_URL }}" type="video/mp4">
                Your browser does not support HTML5 video.
                </video>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>
            <!--PGS Hardware Email Alerts DEMO Video-->
        <div class="modal fade" id="PGSEmailDEMOModal" tabindex="-1" aria-labelledby="PGSEmailDEMOModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="PGSEmailDEMOModalLabel">Plant Growth Station - Automated Email Alert System Demo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex justify-content-center">
                <!-- Video inside modal -->
                <video controls autoplay style="max-width: 100%; height: auto;">
                <source src="{{ PGS_Email_Alerts_DEMO_Video_URL }}" type="video/mp4">
                Your browser does not support HTML5 video.
                </video>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>
        <!--Background Video-->
        <div class="video-wrapper">
        <video autoplay muted loop id="bg-video">
            <source src="{{ url_for('static', filename='/media/videos/background.mp4') }}" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div id="blur-overlay"></div>
        </div>
            {% block content %}
            {% endblock content %}
        <!--From bootstrap documentation-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Script to pause video when modal closes -->
        <script>
        // Select all modals on the page
        var modals = document.querySelectorAll('.modal');

        modals.forEach(function(modal) {
            modal.addEventListener('hidden.bs.modal', function () {
                // Find any video inside the modal
                var video = modal.querySelector('video');
                if (video) {
                    video.pause();
                    video.currentTime = 0; // reset to start
                }
            });
        });
        </script>
        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const topSection = document.querySelector('.top-section');
                topSection.classList.add('visible');
            });
        </script>
        <script>
        document.addEventListener("DOMContentLoaded", function() {
            const nav = document.getElementById("main-navbar");

            // Only apply padding on small screens
            if (window.innerWidth < 992) {  
                document.body.style.paddingTop = nav.offsetHeight + "px";
            }
        });
        </script>
    </body>
</html>
