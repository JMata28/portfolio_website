<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <!--From bootstrap documentation-->
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title> José Mata's Software Engineer Portfolio </title>
        <!--From bootstrap documentation-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
        <!-- Links to use Space Grotesk Font from Google Fonts (license permits this use)-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <video autoplay muted loop id="bg-video">
            <source src="{{ url_for('static', filename='/media/videos/background 2.mp4') }}" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div id="blur-overlay"></div>
        <div class="content">
            {% block content %}
            {% endblock content %}
        </div>
        <!--From bootstrap documentation-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
